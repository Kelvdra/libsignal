# .github/workflows/publish.yml
#
# Publish @kelvdra/libsignal ke npm lewat Trusted Publishing (OIDC),
# tanpa NPM_TOKEN dan tanpa OTP. Jalan setiap push tag "v*.*.*".
#   v1.0.0        -> npm 1.0.0        (dist-tag: latest)
#   v1.0.1-rc.1   -> npm 1.0.1-rc.1   (dist-tag: latest, sesuai permintaan)
#
# Prasyarat (sekali saja):
#   1. Package @kelvdra/libsignal sudah pernah dipublish ke npm
#      (Trusted Publisher hanya bisa diatur untuk package yang sudah ada).
#   2. npmjs.com > package > Settings > Trusted Publisher > GitHub Actions:
#        Organization/user : <owner repo GitHub>
#        Repository        : libsignal
#        Workflow filename : publish.yml
#        Environment       : npm-production
#      Semua isian harus persis sama dengan di GitHub (huruf besar/kecil
#      juga dihitung).
#   3. GitHub repo harus publik dan "repository.url" di package.json harus
#      mengarah ke repo ini.
#   4. (Disarankan) GitHub > Settings > Environments > "npm-production" >
#      Required reviewers, supaya setiap publish perlu approve manual.
#
# Cara rilis:
#   npm version 1.0.1-rc.1 --no-git-tag-version   # ubah package.json
#   git commit -am "release: 1.0.1-rc.1" && git push
#   git tag v1.0.1-rc.1 && git push origin v1.0.1-rc.1

name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

# Satu rilis per tag, jangan dibatalkan di tengah jalan.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validasi: tag, versi, lint, test. Tidak memakai secret apa pun.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # perlu riwayat penuh untuk cek tag ada di branch utama
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Validate tag format and package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $SEMVER ]]; then
            echo "::error::Tag '$TAG' bukan semver valid (contoh: v1.0.0 atau v1.0.0-rc.1)"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) tidak sama dengan version di package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "OK: $TAG -> $PKG_VERSION"

      - name: Ensure tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Commit tag ini tidak ada di branch '$DEFAULT_BRANCH'. Rilis hanya boleh dari branch utama."
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo "::warning::package-lock.json tidak ada, memakai npm install. Disarankan commit lockfile."
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: |
          if [ -d test ] && ls test/*.test.js >/dev/null 2>&1; then
            npm test
          else
            echo "::warning::Folder test/ belum ada, test dilewati."
          fi

      - name: Check package contents
        run: npm pack --dry-run

  # ---------------------------------------------------------------------------
  # 2. Publish via Trusted Publishing (OIDC). Hanya jalan kalau verify lulus.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production # harus sama dengan isian di Trusted Publisher npm
    permissions:
      contents: write # buat GitHub Release
      id-token: write # wajib untuk Trusted Publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing butuh npm >= 11.5.1
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Read package info
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: exists
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION sudah ada di npm, publish dilewati."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Tanpa token: npm otomatis memakai OIDC. Provenance dibuat otomatis.
      # --tag latest dipasang eksplisit supaya versi rc pun jadi "latest".
      - name: Publish (dist-tag latest)
        if: steps.exists.outputs.published == 'false'
        run: npm publish --tag latest --access public

      - name: Show result
        if: steps.exists.outputs.published == 'false'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: npm view "$NAME" dist-tags --json

      - name: Create GitHub Release
        if: steps.exists.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada, dilewati."
            exit 0
          fi
          # Versi dengan "-" (rc, beta, dll) ditandai pre-release di GitHub.
          if [[ "$VERSION" == *-* ]]; then
            FLAGS="--prerelease"
          else
            FLAGS="--latest"
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $FLAGS
